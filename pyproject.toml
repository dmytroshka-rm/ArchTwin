[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isa-cad"
version = "0.5.3"
description = "ISA-CAD Architecture Design Partner & Simulator — Virtual Tech Lead AI Agent"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=1.0.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.22.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "anthropic>=0.30.0",
    "openai>=1.0.0",
    "google-generativeai>=0.5.0",
    "groq>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
]

[project.scripts]
isa-cad = "isa_cad.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["isa_cad*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=isa_cad --cov-report=term-missing"
